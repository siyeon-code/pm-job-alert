# 임시 점검용: GitHub Actions 컴퓨터에서 공공데이터포털 API 연결을 자세히 확인 (확인 후 삭제 예정)
# 슬랙으로는 아무것도 보내지 않고, 연결 결과와 걸린 시간만 출력함
name: 네트워크 점검 (임시)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 실행 컴퓨터 위치
        run: |
          echo "공인 IP 국가: $(curl -s -m 10 https://ipinfo.io/country || echo 확인실패)"

      - name: apis.data.go.kr 주소(IP) 목록
        run: getent ahosts apis.data.go.kr | awk '{print $1}' | sort -u

      - name: IP별 연결 확인 (각 3번, 10초 제한)
        run: |
          for ip in $(getent ahostsv4 apis.data.go.kr | awk '{print $1}' | sort -u); do
            for n in 1 2 3; do
              result=$(curl -s -o /dev/null -m 10 --resolve "apis.data.go.kr:443:$ip" -w "HTTP %{http_code} / 연결 %{time_connect}초" https://apis.data.go.kr/ 2>&1) || result="실패 (curl 종료코드 $?)"
              echo "$ip 시도$n → $result"
            done
          done

      - name: 실제 API 호출 (5번, 키는 GitHub가 로그에서 가림)
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
        run: |
          python3 - <<'EOF'
          import json, os, time, urllib.parse, urllib.request
          key = os.environ["DATA_GO_KR_SERVICE_KEY"]
          params = {"serviceKey": key, "resultType": "json", "ongoingYn": "Y",
                    "workRgnLst": "R3010,R3017", "numOfRows": 300, "pageNo": 1}
          url = "https://apis.data.go.kr/1051000/recruitment/list?" + urllib.parse.urlencode(params)
          for n in range(1, 6):
              start = time.time()
              try:
                  with urllib.request.urlopen(url, timeout=30) as response:
                      data = json.loads(response.read().decode("utf-8"))
                  print(f"시도{n}: resultCode {data.get('resultCode')} / 받은 공고 {len(data.get('result') or [])}건 / {time.time() - start:.1f}초")
              except Exception as error:
                  print(f"시도{n}: 실패 {type(error).__name__} {str(error).replace(key, '****')[:120]} / {time.time() - start:.1f}초")
              time.sleep(3)
          EOF
