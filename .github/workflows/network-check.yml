# 임시 점검용: GitHub Actions 컴퓨터 여러 대에서 공공데이터포털 API 연결을 동시에 비교 (확인 후 삭제 예정)
# 슬랙으로는 아무것도 보내지 않고, 컴퓨터별 공인 IP와 호출 방식별 결과만 출력함
name: 네트워크 점검 (임시)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        runner_no: [1, 2, 3, 4, 5, 6]
    steps:
      - name: 파이썬과 requests 준비
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: requests 설치
        run: pip install -q requests

      - name: 컴퓨터 ${{ matrix.runner_no }} - 공인 IP와 세 가지 방식 비교
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
        run: |
          echo "RESULT 컴퓨터${{ matrix.runner_no }} 공인IP $(curl -s -m 10 https://api.ipify.org || echo 확인실패)"
          curl_result=$(curl -s -o /dev/null -m 15 -w "HTTP %{http_code} 연결 %{time_connect}초" https://apis.data.go.kr/ 2>&1) || curl_result="실패(curl 종료코드 $?)"
          echo "RESULT 컴퓨터${{ matrix.runner_no }} curl → $curl_result"
          python - <<'EOF'
          import json, os, time, urllib.parse, urllib.request
          import requests
          key = os.environ["DATA_GO_KR_SERVICE_KEY"]
          no = os.environ.get("RUNNER_NO", "")
          params = {"serviceKey": key, "resultType": "json", "ongoingYn": "Y",
                    "workRgnLst": "R3010,R3017", "numOfRows": 300, "pageNo": 1}
          base = "https://apis.data.go.kr/1051000/recruitment/list"

          start = time.time()
          try:
              with urllib.request.urlopen(base + "?" + urllib.parse.urlencode(params), timeout=15) as response:
                  data = json.loads(response.read().decode("utf-8"))
              result = f"resultCode {data.get('resultCode')} / {len(data.get('result') or [])}건"
          except Exception as error:
              result = f"실패 {type(error).__name__}"
          print(f"RESULT urllib → {result} / {time.time() - start:.1f}초")

          start = time.time()
          try:
              data = requests.get(base, params=params, timeout=(15, 60)).json()
              result = f"resultCode {data.get('resultCode')} / {len(data.get('result') or [])}건"
          except Exception as error:
              result = f"실패 {type(error).__name__}"
          print(f"RESULT requests → {result} / {time.time() - start:.1f}초")
          EOF
